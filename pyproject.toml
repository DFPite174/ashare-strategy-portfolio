[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-strategy-portfolio"
version = "0.1.0"
description = "A-Share Quantitative Strategy & Portfolio Optimization Subsystem"
readme = "README.md"
authors = [{ name = "Quant Researcher" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "cvxpy>=1.4.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
